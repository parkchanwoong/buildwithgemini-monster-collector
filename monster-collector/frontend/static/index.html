<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몬스터 콜렉터 (Monster Collector)</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root { --accent:#6366f1; --accent-hover:#4f46e5; --bg:#f8fafc; --border:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); display:flex; flex-direction:column; height:100vh; }
  header { background:linear-gradient(135deg, #4338ca, #6366f1, #8b5cf6); color:#fff; padding:.9rem 1.4rem; font-weight:700; font-size:1.15rem; display:flex; align-items:center; justify-content:space-between; box-shadow:0 3px 12px rgba(79,70,229,0.25); }
  .brand { display:flex; align-items:center; gap:.6rem; }
  .brand-badge { background:rgba(255,255,255,0.2); backdrop-filter:blur(4px); font-size:.72rem; padding:.2rem .5rem; border-radius:12px; font-weight:600; letter-spacing:.5px; }
  .header-status { display:flex; align-items:center; gap:.4rem; font-size:.8rem; background:rgba(255,255,255,0.15); padding:.3rem .7rem; border-radius:20px; }
  .status-dot { width:8px; height:8px; background:#4ade80; border-radius:50%; box-shadow:0 0 8px #4ade80; }

  #log { flex:1; overflow-y:auto; padding:1.4rem 1rem; max-width:800px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:1.2rem; }
  .msg-row { display:flex; gap:.75rem; align-items:flex-start; width:100%; animation:fadeIn .25s ease-out; }
  .msg-row.user { flex-direction:row-reverse; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

  /* Hero welcome banner */
  .hero-welcome { text-align:center; padding:2rem 1rem 1.2rem; background:linear-gradient(180deg, #ede9fe 0%, #ffffff 100%); border:1px solid #ddd6fe; border-radius:18px; margin-bottom:.5rem; box-shadow:0 4px 15px rgba(99,102,241,0.06); }
  .hero-icon { font-size:2.6rem; margin-bottom:.4rem; filter:drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
  .hero-title { font-size:1.3rem; font-weight:800; color:#312e81; margin:0 0 .3rem; }
  .hero-desc { font-size:.9rem; color:#475569; margin:0 auto; max-width:520px; line-height:1.5; }
  .hero-tags { display:flex; justify-content:center; gap:.5rem; margin-top:1rem; flex-wrap:wrap; }
  .hero-tag { font-size:.75rem; background:#f1f5f9; color:#475569; padding:.25rem .6rem; border-radius:12px; font-weight:600; }

  /* Avatar icon */
  .avatar { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.15rem; flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .msg-row.agent .avatar { background:linear-gradient(135deg, #4f46e5, #7c3aed); color:#fff; }
  .msg-row.user .avatar { background:linear-gradient(135deg, #0284c7, #2563eb); color:#fff; }

  /* Message content wrapper */
  .msg-content { display:flex; flex-direction:column; max-width:82%; }
  .msg-row.user .msg-content { align-items:flex-end; }
  .msg-sender { font-size:.78rem; font-weight:600; margin-bottom:.25rem; color:#64748b; padding:0 .3rem; }

  /* Chat bubbles */
  .bubble { display:inline-block; padding:.8rem 1.1rem; border-radius:16px; background:#ffffff; border:1px solid #e2e8f0; text-align:left; line-height:1.55; font-size:.96rem; color:#1e293b; box-shadow:0 2px 6px rgba(0,0,0,.04); word-break:break-word; white-space:pre-wrap; }
  .msg-row.agent .bubble { border-top-left-radius:4px; }
  .msg-row.user .bubble { background:linear-gradient(135deg, #6366f1, #4f46e5); color:#ffffff; border:none; border-top-right-radius:4px; box-shadow:0 3px 10px rgba(99,102,241,0.25); }

  /* Typing dots indicator */
  .typing-dots { display:inline-flex; align-items:center; gap:4px; padding:.3rem .4rem; }
  .typing-dot { width:7px; height:7px; background:#818cf8; border-radius:50%; animation:typing 1.4s infinite ease-in-out; }
  .typing-dot:nth-child(2) { animation-delay:.2s; }
  .typing-dot:nth-child(3) { animation-delay:.4s; }
  @keyframes typing { 0%, 60%, 100% { transform:translateY(0); opacity:.4; } 30% { transform:translateY(-5px); opacity:1; } }

  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich { background:transparent; border:none; padding:0; max-width:100%; white-space:normal; box-shadow:none; }

  /* Quick action example buttons */
  .quick-actions { display:flex; gap:.6rem; padding:.6rem 1rem 0; max-width:800px; width:100%; margin:0 auto; overflow-x:auto; }
  .quick-btn { flex:1; min-width:0; padding:.55rem .85rem; background:#fff; border:1px solid #cbd5e1; border-radius:20px; font-size:.85rem; color:#475569; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:.4rem; white-space:nowrap; transition:all .2s; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .quick-btn:hover { background:#ede9fe; border-color:var(--accent); color:var(--accent); transform:translateY(-2px); box-shadow:0 4px 10px rgba(99,102,241,0.2); }
  .quick-btn:active { transform:translateY(0); }

  form { display:flex; gap:.6rem; padding:1rem; border-top:1px solid var(--border); background:#fff; max-width:800px; width:100%; margin:0 auto; }
  input { flex:1; padding:.75rem 1rem; border:1px solid var(--border); border-radius:12px; font-size:1rem; outline:none; transition:all .2s; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(99,102,241,0.18); }
  button { padding:.75rem 1.4rem; border:none; border-radius:12px; background:linear-gradient(135deg, #6366f1, #4f46e5); color:#fff; font-weight:700; cursor:pointer; transition:all .2s; box-shadow:0 2px 6px rgba(99,102,241,0.25); display:flex; align-items:center; gap:.3rem; }
  button:hover { background:linear-gradient(135deg, #4f46e5, #4338ca); transform:translateY(-1px); box-shadow:0 4px 10px rgba(99,102,241,0.35); }
  button:active { transform:translateY(0); }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border:1px solid #e2e8f0; border-radius:16px; padding:1.2rem; background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.06); max-width:100%; transition:transform .2s; }
  .a2card:hover { box-shadow:0 6px 20px rgba(99,102,241,0.1); }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.5rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.5; }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:800; color:#1e1b4b; }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; color:#1e1b4b; }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; color:#312e81; }
  .a2text.a2-h4 { font-size:1rem; font-weight:600; color:#312e81; }
  .a2text.a2-caption { font-size:.85rem; color:#64748b; }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.5rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:12px; display:block; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span>🎮</span>
    <span>몬스터 콜렉터 (Monster Collector)</span>
    <span class="brand-badge">Agent Engine</span>
  </div>
  <div class="header-status">
    <span class="status-dot"></span>
    <span>Online</span>
  </div>
</header>
<div id="log">
  <div class="hero-welcome" id="heroBanner">
    <div class="hero-icon">✨👾🎒</div>
    <h2 class="hero-title">몬스터 콜렉터 모험에 오신 것을 환영합니다!</h2>
    <p class="hero-desc">야생 몬스터를 탐험하고 포획하며, 나만의 파티를 구성하고 상성 배틀 데미지를 시뮬레이션해보세요.</p>
    <div class="hero-tags">
      <span class="hero-tag">🌲 야생 탐험</span>
      <span class="hero-tag">📖 도감 조회</span>
      <span class="hero-tag">⚔️ 배틀 계산</span>
      <span class="hero-tag">🎨 몬스터 이미지 생성</span>
    </div>
  </div>
</div>
<div class="quick-actions">
  <button type="button" class="quick-btn" onclick="sendPrompt('도감에 등록된 몬스터 목록 보여줘')">📖 몬스터 도감 조회</button>
  <button type="button" class="quick-btn" onclick="sendPrompt('위스퍼링 숲을 탐험해서 야생 몬스터 찾아줘')">🌲 야생 숲 탐험하기</button>
  <button type="button" class="quick-btn" onclick="sendPrompt('불 속성 파이로폭스와 물 속성 아쿠아테일의 배틀 데미지 계산해줘')">⚔️ 상성 배틀 계산</button>
</div>
<form id="form">
  <input id="input" placeholder="몬스터에 대해 물어보거나 모험을 떠나보세요…" autocomplete="off" autofocus>
  <button><span>전송</span> <span>➤</span></button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar", who === "user" ? "🎒" : "👾");
  const content = el("div", "msg-content");
  const sender = el("div", "msg-sender", who === "user" ? "트레이너" : "몬스터 가이드");
  const b = el("div", "bubble");
  content.appendChild(sender);
  content.appendChild(b);
  row.appendChild(avatar);
  row.appendChild(content);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
async function handleSend(text) {
  if (!text) return;
  const hero = document.getElementById("heroBanner");
  if (hero) hero.style.display = "none";

  bubble("user").textContent = text;
  input.value = "";
  
  // Show animated typing dots
  const b = bubble("agent");
  const typingWrapper = el("div", "typing-dots");
  typingWrapper.appendChild(el("span", "typing-dot"));
  typingWrapper.appendChild(el("span", "typing-dot"));
  typingWrapper.appendChild(el("span", "typing-dot"));
  b.appendChild(typingWrapper);

  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
}

function sendPrompt(text) {
  input.value = text;
  handleSend(text);
}

form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  handleSend(input.value.trim());
});
</script>
</body>
</html>
